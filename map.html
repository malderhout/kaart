<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Redis Kaart</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-sA+ePHa5fM1V7T1O4NvGQO0mUeR6EwWgA70LktFf1k+UErGfG94mV6K+6T+R1aAknQ4FqMZz7rL+mlf9/6d3UQ=="
      crossorigin=""
    />

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }

      .leaflet-popup-content {
        font-size: 14px;
      }

      #status {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.9);
        padding: 6px 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        font-family: sans-serif;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <div id="status">🛰️ Kaart aan het laden...</div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha512-vtTWMYzeyQWb3+O8tWmeAOHtCk6lKMuzl7E/1LEm1pG4pG7zL5yoMgbZTuHszRmdsAt9mX6Z8D2z+6S2d2m5Ew=="
      crossorigin=""
    ></script>

    <script>
      // 🔗 API endpoint — pas dit aan naar jouw Render backend
      const API_URL = "https://leaflet-redis-backend.onrender.com";

      const map = L.map("map").setView([52.37, 4.9], 13); // Amsterdam

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap-bijdragers"
      }).addTo(map);

      const statusEl = document.getElementById("status");

      // 🟢 Functie om bestaande markers op te halen
      async function loadMarkers() {
        try {
          const res = await fetch(`${API_URL}/api/coordinates`);
          const data = await res.json();

          data.forEach((coord) => {
            L.marker([coord.lat, coord.lng])
              .addTo(map)
              .bindPopup(
                `<b>Marker:</b> ${coord.id}<br>Lat: ${coord.lat.toFixed(
                  5
                )}<br>Lng: ${coord.lng.toFixed(5)}`
              );
          });

          statusEl.textContent = `✅ ${data.length} markers geladen`;
        } catch (err) {
          console.error(err);
          statusEl.textContent = "❌ Fout bij laden van markers";
        }
      }

      // 🟢 Klik op de kaart om een nieuwe marker toe te voegen
      map.on("click", async (e) => {
        const { lat, lng } = e.latlng;

        // Plaats marker lokaal
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`📍 Nieuw punt<br>Lat: ${lat.toFixed(
          5
        )}<br>Lng: ${lng.toFixed(5)}`).openPopup();

        // Stuur naar backend
        try {
          const res = await fetch(`${API_URL}/api/coordinates`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat, lng })
          });

          const result = await res.json();
          if (res.ok) {
            statusEl.textContent = `✅ Punt opgeslagen (${lat.toFixed(
              4
            )}, ${lng.toFixed(4)})`;
          } else {
            statusEl.textContent = "⚠️ Opslaan mislukt: " + result.error;
          }
        } catch (err) {
          console.error(err);
          statusEl.textContent = "❌ Fout bij verzenden naar server";
        }
      });

      // 📡 Start
      loadMarkers();
    </script>
  </body>
</html>
