<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaflet + Redis Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.37, 4.90], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap-bijdragers'
    }).addTo(map);

    // Load saved markers from Redis
    async function loadMarkers() {
      const res = await fetch('http://localhost:3000/api/coordinates');
      const data = await res.json();
      data.forEach(p => {
        L.marker([p.lat, p.lng])
          .addTo(map)
          .bindPopup(`Lat: ${p.lat.toFixed(5)}<br>Lng: ${p.lng.toFixed(5)}`);
      });
    }

    loadMarkers();

    // Click event → store new coordinate
    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;

      L.marker([lat, lng]).addTo(map)
        .bindPopup(`Lat: ${lat.toFixed(5)}<br>Lng: ${lng.toFixed(5)}`)
        .openPopup();

      try {
        const response = await fetch('http://localhost:3000/api/coordinates', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lng })
        });

        if (!response.ok) throw new Error('Failed to save');
        console.log('✅ Saved to Redis:', { lat, lng });
      } catch (err) {
        console.error('❌ Error saving:', err);
      }
    });
  </script>
</body>
</html>
